    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Contacto Ignacio Vizoso",
      "url": "https://infodumper.net/contacto.html",
      "mainEntity": {
        "@type": "Person",
        "@id": "https://infodumper.net/#person",
        "name": "Ignacio Vizoso"
      }
    }
    </script>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PHDCTSW4"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <site-header base-path="./"></site-header>

    <main class="content-wrapper">
        <section class="section-contacto" style="padding-top: 4rem; padding-bottom: 5rem; min-height: 80vh;">
            <div class="section-center" style="padding-top: 0; padding-bottom: 2rem;">
                <span class="overline overline-blue">HABLEMOS</span>
                <h2 class="title-blue">¿Empezamos a darle forma a tu proyecto?</h2>
                <p class="section-subtitle">
                    Conversemos sobre los procesos, datos o cuellos de botella de tu negocio o emprendimiento para diseñar una solución técnica eficiente.
                </p>
            </div>
            <div class="form-container">
                <form id="contact-form" action="#" novalidate>
                    <div class="form-row">
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" required autocomplete="name">
                        <input type="text" id="empresa" name="empresa" placeholder="Empresa o proyecto (opcional)">
                    </div>
                    <div class="form-row">
                        <input type="email" id="email" name="email" placeholder="Tu correo electrónico de contacto" required autocomplete="email">
                        <input type="tel" id="telefono" name="telefono" placeholder="WhatsApp / Teléfono (opcional)">
                    </div>
                    <div style="margin-bottom: 1.25rem;">
                        <select id="desafio" name="desafio" required style="cursor: pointer;">
                            <option value="" disabled selected>¿Cuál es el principal desafío operativo a resolver?</option>
                            <option value="procesos">Procesos manuales / Dependencia de hojas de cálculo dispersas</option>
                            <option value="aec">Cómputo métrico, costos o presupuesto de obra (AEC)</option>
                            <option value="software">Sistema de gestión a medida / Backoffice / CRM</option>
                            <option value="automatizacion">Automatización e integración entre sistemas / APIs</option>
                            <option value="ia">Agentes de Inteligencia Artificial &amp; RAG Privado</option>
                            <option value="otro">Otro desafío técnico a medida</option>
                        </select>
                    </div>
                    <textarea id="mensaje" name="mensaje" placeholder="Describe brevemente el sistema, automatización o integración que necesitas implementar..." rows="5" required></textarea>
                    
                    <button type="submit" class="btn btn-primary btn-full" style="padding: 0.95rem; font-size: 1rem;">
                        <i class="fas fa-paper-plane"></i> ENVIAR SOLICITUD DE DIAGNÓSTICO
                    </button>
                    <p class="form-note">
                        También puedes contactarme directamente vía 
                        <a href="https://www.linkedin.com/in/ignacio-vizoso/" target="_blank" rel="noopener noreferrer" style="color: var(--accent); font-weight: 600; text-decoration: none;">LinkedIn</a>, 
                        por 
                        <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" style="color: #25d366; font-weight: 600; text-decoration: none;">WhatsApp</a> 
                        o 
                        <a href="https://cal.com/ignacio-vizoso" target="_blank" rel="noopener noreferrer" style="color: #145890; font-weight: 600; text-decoration: none;"><i class="fas fa-calendar-alt"></i> Agendar en Cal.com</a>.
                    </p>
                </form>
            </div>
        </section>
    </main>

    <site-footer base-path="./"></site-footer>
    <script src="./scripts/components.js" defer></script>
    <script src="./scripts/contacto.js" defer></script>
</body>
